[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,tracks/*.json,docs/*.md"
exclude_filter="tests/*,tools/*,build/*,packaging/*,trackgen/*,reference/*,assets/generated-originals/*,assets/cc0-source/*,assets/audio-source/*"
export_path="build/RacingSim.exe"

[preset.0.options]
custom_template/debug="res://tools/windows_debug_x86_64.exe"
custom_template/release="res://tools/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,tracks/*.json,docs/*.md"
exclude_filter="tests/*,tools/*,build/*,packaging/*,trackgen/*,reference/*,assets/generated-originals/*,assets/cc0-source/*,assets/audio-source/*"
export_path="build/macos/Racing Sim.app"

[preset.1.options]
custom_template/debug="res://tools/macos.zip"
custom_template/release="res://tools/macos.zip"
binary_format/architecture="universal"
application/bundle_identifier="com.zainyasin.racingsim"
application/app_category="Racing-games"
application/short_version="1.0.0"
application/version="1.0.0"
display/high_res=true
codesign/codesign=1
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
