[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,trackgen/data/chicago/route.json,trackgen/data/chicago/city.json,trackgen/data/spa/centreline.json,trackgen/data/spa/terrain.json,trackgen/data/spa/dem.raw,trackgen/data/spa/road-profile.json,trackgen/data/spa/kerbs.json,trackgen/data/nordschleife/centreline.json,trackgen/data/nordschleife/terrain.json,trackgen/data/nordschleife/dem.raw,trackgen/data/nordschleife/kerbs.json,trackgen/data/nordschleife/centreline_full.json,trackgen/data/nordschleife/terrain_full.json,trackgen/data/nordschleife/dem_full.raw"
exclude_filter="tests/*,tools/*,build/*,docs/*,assets/cars/*/scene.*,assets/cars/*/prepare.py,packaging/*,reference/*,assets/generated-originals/*,assets/cc0-source/*,assets/audio-source/*"
export_path="build/RacingSim.exe"

[preset.0.options]
custom_template/debug="res://tools/windows_debug_x86_64.exe"
custom_template/release="res://tools/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

